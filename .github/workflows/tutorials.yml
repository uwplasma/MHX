name: Tutorials

on:
  workflow_dispatch:
  schedule:
    # Monthly drift check. Docs builds never execute notebooks, so this job
    # is the only thing that catches a solver change breaking a tutorial.
    - cron: "0 6 1 * *"

permissions:
  contents: read

jobs:
  execute:
    name: Re-execute tutorial notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install MHX with tutorial tools
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install ipykernel
      - name: Execute notebooks
        run: python tools/execute_tutorials.py
      - name: Show output drift
        run: git diff --stat docs/tutorials
