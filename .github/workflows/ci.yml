name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      JAX_PLATFORM_NAME: cpu
      JAX_ENABLE_X64: "1"
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check src tests examples tools
      - name: Fast tests
        run: |
          python -m pytest -m "not slow"

  release-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JAX_PLATFORM_NAME: cpu
      JAX_ENABLE_X64: "1"
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Fast coverage slice
        run: |
          python -m pytest -m "not slow" --cov=mhx --cov-report=
      - name: Slow release-gate coverage slice
        run: |
          python -m pytest -m slow --cov=mhx --cov-append --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=85
      - name: Upload coverage JSON
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: error

  coverage-badge:
    runs-on: ubuntu-latest
    needs: [test, release-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v7.0.0
        with:
          name: coverage-json
          path: .coverage-artifacts
      - name: Update coverage badge endpoint
        run: |
          python tools/write_coverage_badge.py .coverage-artifacts/coverage.json badges/coverage.json
          git diff -- badges/coverage.json
      - name: Commit coverage badge
        run: |
          if git diff --quiet -- badges/coverage.json; then
            echo "coverage badge unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.json
          git commit -m "Update coverage badge [skip ci]"
          git push

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JAX_PLATFORM_NAME: cpu
      JAX_ENABLE_X64: "1"
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check docs links
        run: |
          python -m pytest tests/test_docs_links.py
      - name: Build docs
        run: |
          sphinx-build -W -b html docs docs/_build/html
