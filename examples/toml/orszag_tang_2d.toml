# Incompressible reduced-MHD Orszag--Tang vortex on the 2*pi periodic box.
# Run it with:  mhx run examples/toml/orszag_tang_2d.toml
name = "orszag_tang_2d"
output_dir = "outputs/toml/orszag_tang_2d"

[mesh]
shape = [128, 128]

[time]
t1 = 3.0
dt = 0.005
save_every = 20

[physics]
model = "reduced_mhd"
equilibrium = "orszag_tang"
resistivity = 1.0e-3
viscosity = 1.0e-3
